name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Suite checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Portal, neural network, RL, and language model tests
        run: npm run check
